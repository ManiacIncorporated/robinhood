[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robinhood-distill"
version = "0.2.0"
description = "Democratizing frontier reasoning — distill reasoning traces from Claude, GPT-4, and other LLMs into finetuning datasets, then train your own models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "distillation",
    "reasoning",
    "chain-of-thought",
    "finetuning",
    "llm",
    "claude",
    "gpt-4",
    "unsloth",
    "lora",
    "sft",
    "extended-thinking",
    "knowledge-distillation",
    "model-training",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
all = ["openai>=1.0.0", "pyyaml>=6.0"]
train = [
    "unsloth",
    "trl",
    "transformers",
    "datasets",
    "torch",
]
dev = [
    "pytest>=7.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
robinhood = "robinhood.pipeline:main"
robinhood-train = "robinhood.trainer:main"

[project.urls]
Homepage = "https://github.com/ManiacIncorporated/robinhood"
Repository = "https://github.com/ManiacIncorporated/robinhood"
Issues = "https://github.com/ManiacIncorporated/robinhood/issues"

[tool.hatch.build.targets.wheel]
packages = ["robinhood"]
